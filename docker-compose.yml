# SirSavings — full stack (API + SPA) for the VPS.
#
# The "frontend" container serves the built SPA and reverse-proxies /api to the
# "backend" container, so the whole site is single-origin. Only the frontend is
# attached to the shared external "web" network, so Caddy reaches it by name:
#
#     sirsavings.com, sirsavings.co.uk {
#         reverse_proxy sirsavings-web:80
#     }
#
# Both domains hit the same container; the SPA picks UK vs international copy
# from the request hostname at runtime.
#
# First run on the VPS (the "web" network is created by your Caddy stack):
#     docker compose up -d --build
# If "web" does not exist yet:  docker network create web
name: sirsavings

services:
  backend:
    build:
      context: ./backend/VoucherCodes.Api
      dockerfile: Dockerfile
    image: sirsavings-api
    container_name: sirsavings-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Data Source=/data/vouchers.db"
      # Read from .env. The `:?` form makes compose fail fast at `up` time if
      # ADMIN_PASSWORD isn't set — better than silently falling back to "changeme".
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
    volumes:
      - vouchers-data:/data
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Wire up the Umami snippet at build time (see .env). Leave blank to
        # ship with no analytics.
        VITE_UMAMI_SRC: ${UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    image: sirsavings-web
    container_name: sirsavings-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - web
    # No host ports published: Caddy on the shared "web" network is the only
    # ingress. Uncomment to hit the site directly during local testing.
    # ports:
    #   - "8088:80"

  # ── Privacy-friendly analytics (self-hosted Umami) ──────────
  # No cookies, no personal data, no consent banner needed. After the first
  # deploy, open https://analytics.<your-domain> create a website, then put its
  # script URL + ID in .env and rebuild the frontend so the snippet is included.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: sirsavings-umami
    restart: unless-stopped
    depends_on:
      - umami-db
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-please-change-this-secret}
    networks:
      - internal
      - web

  umami-db:
    image: postgres:16-alpine
    container_name: sirsavings-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  # Private network for frontend ⇄ backend ⇄ analytics traffic.
  internal:
    driver: bridge
  # Shared, externally-created network Caddy lives on. Created by your Caddy
  # stack — we only attach to it, we don't manage it.
  web:
    external: true
    name: web

volumes:
  vouchers-data:
  umami-db-data:
