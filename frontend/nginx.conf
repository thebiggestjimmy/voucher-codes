# SirSavings web container: serves the built SPA and proxies /api to the
# backend container so the whole site is single-origin behind Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets (Caddy may also do this at the edge; harmless either way).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API → backend container (service name on the internal network). The
    # /api prefix is preserved to match the controllers' [Route("api/...")].
    location /api/ {
        proxy_pass http://sirsavings-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
